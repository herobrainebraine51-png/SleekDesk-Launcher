name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Files
        run: |
          mkdir -p app/src/main/res/values
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "" | base64 -d > app/src/main/res/values/themes.xml
          head -n 250 app/src/main/java/com/example/sleekdesklauncher/MainActivity.kt > ok.kt
          echo "" | base64 -d >> ok.kt
          mv ok.kt app/src/main/java/com/example/sleekdesklauncher/MainActivity.kt
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.5' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: SleekDesk-Launcher-APK, path: app/build/outputs/apk/debug/app-debug.apk }
